# Dry-run profile: builds every training item with the real tokenizer and the
# real config, prints the optimizer-update budget, and loads NO weights.
# This is the profile to run first on every new dataset.
#
#   laya-pipeline train --profile configs/dry_run.yaml --dataset relevance
#
# Cost: a tokenizer download on first run, then seconds. No GPU, no training.

project:
  seed: 20260922

training:
  epochs: 1
  micro_batch: 4
  grad_accum: 16
  encoder_lr: 2.5e-5
  head_lr: 1.0e-4
  loss: rlcd
  shuffle_options: []
  freeze_encoder: false
  calib_max: 200
  calib_frac: 0.1
  calib_seed: 20260922
  seed: 20260922
  max_len: 1024
  head_max_len: 256
  amp: true
  gradient_checkpointing: true
  log_every: 50
  label_smoothing: 0.0
  target_error: 0.10
  min_abstain_n: 10
  device: auto