# Central configuration for the whole pipeline.
#
# Every module reads from here. `src/` contains no endpoint, no absolute path and
# no model name that is not a structural default; environment variables (see
# .env.example) override the keys listed in `env_overrides` at the bottom.
#
# CLI:  laya-pipeline --config configs/default.yaml <command>

project:
  name: laya-persian-rag
  seed: 20260922

paths:
  corpus_dir: corpus
  output_dir: outputs
  prompt_dir: prompts

# --- Ingestion and chunking -------------------------------------------------
# Sizes are in tokens of the configured tokenizer. When the tokenizer cannot be
# loaded (no network, no transformers), chunker falls back to a character
# estimate and records `token_count_source: "estimated"` so downstream stages
# can tell the difference.
chunking:
  tokenizer_model: convaiinnovations/laya-multilingual
  tokenizer_max_length: 8192
  target_tokens: 320
  max_tokens: 448
  min_tokens: 48
  overlap_blocks: 1
  include_heading_path: true
  include_section_title: true
  chars_per_token_estimate: 2.6
  min_chunk_chars: 120

# --- Ollama -----------------------------------------------------------------
# Generation and labeling are separate models on purpose: question generation
# wants a creative model, labeling wants an obedient one.
ollama:
  endpoint: http://127.0.0.1:11434
  generation_model: qwen2.5:7b-instruct
  embedding_model: bge-m3
  teacher_model: qwen2.5:7b-instruct
  timeout_seconds: 180.0
  connect_timeout_seconds: 10.0
  max_retries: 3
  retry_backoff_seconds: 1.5
  num_ctx: 8192
  keep_alive: 10m

  # Send `think: false`. Reasoning models (the Qwen3 family, and others) emit a
  # long chain of thought into a separate field before answering. For extraction
  # and classification that budget is not just wasted: a 2B model spent 4060
  # tokens thinking about a one-line question, hit the context limit, and
  # returned an EMPTY content field with done_reason: "length" — which the
  # pipeline reports as "model response contains no JSON object: ''".
  #
  # Set to null to let the model deliberate. That is the right choice for a large
  # reasoning model on a task that genuinely needs deliberation; it is the wrong
  # choice for this pipeline's extraction prompts.
  think: false

  cache_dir: outputs/cache/ollama

generation:
  questions_per_chunk: 3
  max_key_points: 4
  min_chunk_chars: 200
  max_question_chars: 320
  min_question_chars: 15
  temperature: 0.7
  top_p: 0.9
  seed: 20260922
  resume: true
  workers: 1
  # Confirm each generated question is actually answerable from its source
  # chunk before it becomes a positive example. Turning this off makes
  # "relevant" an assumption rather than a finding.
  verify_positives: true
  question_types:
    - direct
    - paraphrase
    - conversational
    - terminology
    - alternative
    - hard

negatives:
  # Negatives per positive, averaged across strategies. 1.0 is balanced.
  ratio: 1.0
  strategies: [random, lexical, retrieval]
  # Share of the negative budget per strategy. Must be the same length as
  # `strategies` and must sum to ~1.0.
  strategy_weights: [0.34, 0.33, 0.33]
  candidates_per_positive: 12
  # Retrieval hard negatives are drawn from ranks [min_similarity, max_similarity]
  # of the ranked candidate list so that trivially-unrelated chunks are skipped
  # and near-duplicates of the positive are excluded.
  min_similarity: 0.25
  max_similarity: 0.92
  near_duplicate_threshold: 0.85
  lexical_candidates: 8
  # Every surviving candidate is checked against the query by the teacher.
  # Turning this off produces unverified negatives and is not recommended.
  verify_with_teacher: true

labeling:
  # Proposals at or above this teacher confidence are accepted automatically.
  review_threshold: 0.80
  # Proposals inside this band are queued for human review rather than accepted.
  uncertain_low: 0.35
  uncertain_high: 0.65
  temperature: 0.0

splitting:
  seed: 20260922
  train: 0.70
  validation: 0.15
  test: 0.15
  # Documents whose normalized content is at least this similar (shingle
  # Jaccard) are merged into one family and land in the same split.
  family_similarity_threshold: 0.70
  # Identical or near-identical queries above this similarity across splits are
  # reported as leakage.
  query_leakage_threshold: 0.90
  paraphrase_ngram: 3
  warn_below_groups: 10

# --- Laya question definitions ---------------------------------------------
# SINGLE SOURCE OF TRUTH. The dataset builder, the validator and the evaluation
# harness all build questions from here. A question that differs between
# training and inference is a defect, so do not duplicate this wording anywhere.
laya:
  base_model: convaiinnovations/laya-multilingual
  max_len: 1024
  head_max_len: 256
  max_options: 8
  language: fa

  # Which option plays which role when the pipeline builds a positive or a
  # negative. Validated against the criteria above, so these cannot drift.
  label_roles:
    relevance:
      positive: relevant
      negative: irrelevant

  state_templates:
    relevance: |
      پرسش کاربر:
      {{query}}

      متن بازیابی‌شده:
      {{chunks}}
    sufficiency: |
      پرسش کاربر:
      {{query}}

      متن‌های بازیابی‌شده:
      {{chunks}}
    routing: |
      پرسش کاربر:
      {{query}}

  questions:
    relevance:
      type: choice
      instructions: "آیا متن بازیابی‌شده برای پاسخ به پرسش کاربر مرتبط است؟"
      criteria:
        relevant: "متن بازیابی‌شده اطلاعات لازم برای پاسخ به پرسش کاربر را در بر دارد."
        irrelevant: "متن بازیابی‌شده دربارهٔ موضوعی متفاوت است و به پرسش کاربر پاسخ نمی‌دهد."

    sufficiency:
      type: choice
      instructions: "آیا متن‌های بازیابی‌شده برای پاسخ کامل به پرسش کاربر کافی هستند؟"
      criteria:
        sufficient: "همهٔ نکات لازم برای پاسخ کامل در متن‌های بازیابی‌شده آمده است."
        partial: "تنها بخشی از نکات لازم آمده است و پاسخ کامل ممکن نیست."
        insufficient: "نکات لازم برای پاسخ در متن‌های بازیابی‌شده نیست."

    routing:
      type: choice
      instructions: "برای یافتن پاسخ این پرسش، کدام راهبرد بازیابی مناسب‌تر است؟"
      criteria:
        semantic: "پرسش مفهومی است و بازیابی معنایی بر پایهٔ نزدیکی معنا کافی است."
        keyword: "پرسش به یک شناسه، کد یا عبارت دقیق وابسته است و تطبیق واژگانی لازم دارد."
        hybrid: "پرسش هم نشانهٔ دقیق دارد و هم برای تشخیص، درکِ بافت پیرامون آن لازم است."

# --- Training ---------------------------------------------------------------
# Mirrors laya.train.TrainConfig field for field. `laya-train` cannot express
# amp, gradient_checkpointing or the calibration knobs, so this stage calls the
# Python API directly (AGENTS.md 3.3).
#
# Starting point for a >=16 GB card. NOT measured on any card — the only hardware
# checked here is an RTX 3050 Laptop with 3.7 GiB, which needs micro_batch 1,
# gradient_checkpointing, and probably a shorter max_len. Start from configs/smoke.yaml.
training:
  epochs: 8
  micro_batch: 4
  grad_accum: 16          # effective batch = micro_batch * grad_accum = 64
  encoder_lr: 2.5e-5
  head_lr: 1.0e-4
  min_lr: 1.0e-6
  weight_decay: 0.01
  grad_clip: 1.0
  loss: rlcd              # rlcd | soft-ce
  rl_samples: 4
  sigma_start: 0.4
  sigma_end: 0.1
  w_sph: 0.75
  w_rps: 1.0
  shuffle_options: []     # [] or ["choice"]
  option_layout: null     # null | sequential | parallel
  freeze_encoder: false
  # Laya holds its own calibration slice out of the train file. Our validation
  # split is additionally passed as eval_data, so `before`/`after` metrics are
  # genuinely held out.
  calib_max: 200
  calib_frac: 0.1
  calib_seed: 20260922
  seed: 20260922
  max_len: 1024
  head_max_len: 256
  amp: true
  gradient_checkpointing: true
  log_every: 50
  label_smoothing: 0.0
  target_error: 0.10
  min_abstain_n: 10
  device: auto

evaluation:
  batch_size: 16
  latency_repeats: 1
  retrieval_ks: [1, 3, 5, 10]
  retrieval_backend: ollama   # ollama | laya_encoder | lexical
  # Reference checkpoints compared side by side in the report.
  base_model: convaiinnovations/laya-multilingual
  fine_tuned_model: null      # set by the operator after a training run

# Environment variables that override the matching config key.
#
# A bare key names a field of the `ollama` section; a dotted key names a field
# anywhere else (`paths.corpus_dir`). Values are coerced to the type the
# dataclass declares, and an uncoercible value is an error rather than a string
# that fails later somewhere unrelated.
#
# The variables are read from the real environment first and then from `.env`
# at the project root. A real environment variable always wins, so
# `LAYA_OLLAMA_TEACHER_MODEL=... laya-pipeline generate` overrides the file for
# one command without editing it.
env_overrides:
  endpoint: LAYA_OLLAMA_ENDPOINT
  generation_model: LAYA_OLLAMA_GENERATION_MODEL
  embedding_model: LAYA_OLLAMA_EMBEDDING_MODEL
  teacher_model: LAYA_OLLAMA_TEACHER_MODEL
  num_ctx: LAYA_OLLAMA_NUM_CTX
  think: LAYA_OLLAMA_THINK
  paths.corpus_dir: LAYA_CORPUS_DIR
  paths.output_dir: LAYA_OUTPUT_DIR